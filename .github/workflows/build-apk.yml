# Fixo Gateway — build the debug APK in the cloud (GitHub Actions)
# The source is uploaded as fixo-gateway-android.zip; this workflow
# unzips it first, then builds. No secrets are used anywhere.
# NOTE: do NOT use android-actions/setup-android — it fails on the
# current runner looking for the obsolete 'tools' package. The runner
# already has the Android SDK preinstalled; we install the needed
# packages with sdkmanager directly.

name: Build Fixo Gateway APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unzip app source
        run: unzip -o fixo-gateway-android.zip -x ".github/*"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages and accept licenses
        run: |
          ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses
          "$SDKMGR" "platforms;android-33" "build-tools;33.0.0"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fixo-gateway-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
